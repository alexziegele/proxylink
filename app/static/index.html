<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxylink</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1216; --card: #171b21; --card-h: #1e232b; --line: #262c35; --chip: #20262e;
    --text: #e6e9ee; --muted: #8a93a1; --accent: #7b5cff;
    --grad: linear-gradient(120deg, #ff4ecd, #7b5cff 52%, #16d9c0); --track: #262c35;
    --up: #4cb782; --warn: #e2b340; --down: #e66a5a; --unk: #6b7380; --sw: #4a525e;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --card: #fff; --card-h: #f0f3f7; --line: #e1e4e9; --chip: #f1f3f6;
            --text: #1a1d22; --muted: #6b7380; --accent: #6a4cf0; --sw: #c3c8d0; --track: #e6e8ec; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 36px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.03em; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 36px; height: 36px; filter: drop-shadow(0 4px 12px rgba(123,92,255,.35)); }
  h1 .lk { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  a.btn { text-decoration: none; display: inline-block; }

  /* Proxmox-Status */
  #status { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .node .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
  .node .hd small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .bar { margin-top: 7px; font-size: 12px; color: var(--muted); }
  .bar .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .bar .tr { display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar .fl { display: block; height: 100%; border-radius: 3px; background: var(--up); transition: width .4s; }
  .bar .fl.warn { background: var(--warn); } .bar .fl.crit { background: var(--down); }
  .bar .v { font-variant-numeric: tabular-nums; color: var(--text); }
  .bar .v small { color: var(--muted); }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  input, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                  border-radius: 8px; padding: 8px 12px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #search { width: 170px; max-width: 100%; }
  @media (max-width: 1240px) { #clock { display: none; } }
  nav { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  nav button.on { background: var(--card-h); color: var(--text); }
  .btn { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
         color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--down); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       font-weight: 600; margin: 26px 0 10px; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* Kacheln */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .card { position: relative; display: flex; flex-direction: column; border-radius: 10px; min-width: 0;
          background: var(--card); border: 1px solid var(--line); transition: background .12s, border-color .12s; }
  .card:hover { background: var(--card-h); border-color: var(--accent); }
  .card.unp { border-style: dashed; }
  a.main { display: flex; gap: 12px; align-items: center; padding: 12px 34px 8px 14px; color: inherit;
           text-decoration: none; min-width: 0; border-radius: 10px 10px 0 0; }
  a.main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ic { flex: none; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
        font-weight: 700; font-size: 16px; color: #fff; overflow: hidden; }
  .ic { position: relative; }
  .ic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .card.hid { opacity: .45; }
  .tx { min-width: 0; flex: 1; }
  .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dm { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.off a.main { opacity: .5; }
  .st { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unk); }
  .dot.up { background: var(--up); } .dot.warn { background: var(--warn); } .dot.down { background: var(--down); }
  .sw { width: 24px; height: 14px; border-radius: 7px; background: var(--sw); position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .edit { position: absolute; right: 6px; top: 26px; background: none; border: 0; color: var(--muted); cursor: pointer;
          font-size: 14px; padding: 2px 4px; opacity: 0; transition: opacity .12s; }
  .card:hover .edit, .edit:focus-visible { opacity: 1; }
  .edit:hover { color: var(--accent); }
  .addrs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px 62px; }
  .cp { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted); background: var(--chip); border: 1px solid transparent; border-radius: 5px; padding: 2px 6px; cursor: pointer; }
  .cp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp:hover { color: var(--text); border-color: var(--line); }
  .cp svg { flex: none; width: 11px; height: 11px; }
  .cp.ok { color: var(--up); }

  /* Abgleich */
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--card-h); }
  tr:last-child td { border-bottom: 0; }
  td .sub { color: var(--muted); font-size: 12px; }
  td a { color: var(--accent); text-decoration: none; } td a:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 12px; background: var(--card-h);
         border: 1px solid var(--line); white-space: nowrap; }
  .s-up { color: var(--up); } .s-down { color: var(--down); } .s-warn { color: var(--warn); } .s-unknown, .s-off { color: var(--unk); }
  .wrap { overflow-x: auto; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 4px 0; }
  #msg { margin-top: 18px; font-size: 13.5px; }
  #msg .err { color: var(--down); } #msg .wrn { color: var(--warn); }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  footer button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }

  /* Dialog */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text);
           padding: 22px; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 14px; font-size: 17px; }
  dialog label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  dialog input { width: 100%; }
  dialog .row { display: flex; gap: 8px; margin-top: 18px; }
  dialog .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  dialog .icrow { display: flex; gap: 8px; align-items: center; }
  dialog .icrow img { width: 34px; height: 34px; object-fit: contain; flex: none; border-radius: 6px; background: var(--chip); }
  dialog .chk { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--text); font-size: 14px; }
  dialog .chk input { width: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .unit { position: relative; } .unit input { padding-right: 44px; }
  .unit span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  dialog .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 2px; }
  dialog .ok { color: var(--up); font-size: 13px; min-height: 1em; margin-top: 10px; }
  .active-alerts { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); border-radius: 8px;
                   padding: 8px 12px; font-size: 13px; margin-bottom: 4px; }
  #alerts-badge:not(:empty) { margin-left: 6px; background: var(--down); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; }
  dialog .err { color: var(--down); font-size: 13px; min-height: 1em; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><img src="logo.svg" alt=""><span id="title"><span>proxy</span><span class="lk">link</span></span></h1>
    <span id="clock"></span>
    <span class="spacer"></span>
    <nav><button data-v="links" class="on">Links</button><button data-v="audit">Abgleich</button></nav>
    <a class="btn" id="zoraxy" target="_blank" rel="noopener" hidden>Zoraxy ↗</a>
    <button class="btn" id="alerts-btn" title="Alarme &amp; Telegram">🔔 Alarme<span id="alerts-badge"></span></button>
    <button class="btn" id="add">+ Eintrag</button>
    <input id="search" type="search" placeholder="Suchen…  ( / )" autocomplete="off">
  </header>
  <div id="status"></div>
  <div id="view"></div>
  <div id="msg"></div>
  <footer><span id="upd"></span> · <button id="reload">jetzt neu laden</button>
    <span id="hid-wrap" hidden> · <button id="toggle-hidden"></button></span></footer>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlg-title">Eigener Eintrag</h3>
    <input type="hidden" name="id"><input type="hidden" name="key">
    <label>Name <span class="m-custom">*</span></label><input name="name">
    <label>URL <span class="m-custom">*</span></label><input name="url" placeholder="https://… oder 192.168.10.20:8080">
    <label>Gruppe</label><input name="group" list="groups" placeholder="Eigene">
    <datalist id="groups"></datalist>
    <label>Beschreibung</label><input name="description">
    <div class="m-custom"><label>IP:Port (optional, für Kopieren &amp; Status)</label><input name="origin" placeholder="192.168.10.20:8080"></div>
    <label>Icon</label>
    <div class="icrow"><input name="icon" placeholder="z. B. jellyfin oder https://…/icon.svg"><img id="ic-prev" alt=""></div>
    <div class="hint">Name aus <a href="https://dashboardicons.com" target="_blank" rel="noopener">dashboardicons.com</a> oder eine Bild-URL. Leer = automatisch.</div>
    <label class="chk m-ov"><input type="checkbox" name="hide"> Kachel ausblenden</label>
    <div id="tok-wrap" hidden><label>Bearbeitungs-Token</label><input name="token" type="password"></div>
    <div class="err" id="dlg-err"></div>
    <div class="row">
      <button class="btn primary" value="save">Speichern</button>
      <button class="btn" value="cancel" formnovalidate>Abbrechen</button>
      <span class="spacer"></span>
      <button class="btn danger" value="delete" id="del" formnovalidate hidden>Löschen</button>
      <button class="btn" value="reset" id="ov-reset" formnovalidate hidden>Zurücksetzen</button>
    </div>
  </form>
</dialog>

<dialog id="adlg">
  <form id="aform" method="dialog">
    <h3>Alarme</h3>
    <div id="a-active"></div>
    <div class="sec">Telegram</div>
    <label class="chk"><input type="checkbox" name="telegram_enabled"> Benachrichtigungen per Telegram senden</label>
    <label>Bot-Token</label><input name="telegram_token" type="password" autocomplete="off" placeholder="123456:ABC… von @BotFather">
    <div class="hint" id="tok-hint"></div>
    <label>Chat-ID</label><input name="telegram_chat_id" placeholder="z. B. 123456789 oder -100…">
    <div class="sec">Grenzwerte</div>
    <div class="grid2">
      <div><label>CPU</label><div class="unit"><input name="cpu" type="number" min="0" max="100" step="1"><span>%</span></div></div>
      <div><label>RAM</label><div class="unit"><input name="ram" type="number" min="0" max="100" step="1"><span>%</span></div></div>
      <div><label>Disk / Storage</label><div class="unit"><input name="disk" type="number" min="0" max="100" step="1"><span>%</span></div></div>
      <div><label>Dauer über Grenze</label><div class="unit"><input name="minutes" type="number" min="0" max="1440" step="0.5"><span>min</span></div></div>
      <div><label>Entwarnung ab</label><div class="unit"><input name="hysteresis" type="number" min="0" max="50" step="1"><span>% drunter</span></div></div>
      <div><label>Erinnerung alle</label><div class="unit"><input name="repeat" type="number" min="0" max="10080" step="5"><span>min</span></div></div>
    </div>
    <div class="hint">0 = aus. Erinnerung 0 = nur einmal melden.</div>
    <label class="chk"><input type="checkbox" name="node_down"> Melden, wenn ein Proxmox-Node offline geht</label>
    <div id="atok-wrap" hidden><label>Bearbeitungs-Token</label><input name="token" type="password"></div>
    <div class="err" id="a-err"></div><div class="ok" id="a-ok"></div>
    <div class="row">
      <button class="btn primary" value="save">Speichern</button>
      <button class="btn" value="test" formnovalidate>Test senden</button>
      <span class="spacer"></span>
      <button class="btn" value="cancel" formnovalidate>Schließen</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
let D = { links: [], services: [], guests: [], containers: [], sources: {} };
const ls = { get(k) { try { return localStorage.getItem("proxylink." + k); } catch { return null; } },
             set(k, v) { try { localStorage.setItem("proxylink." + k, v); } catch {} } };
let view = ls.get("view") || "links";
let showHidden = false;
let S = null; // Proxmox-Status

/* Icons: Name aus dashboard-icons, URL oder automatisch (Name/Subdomain), Fallback Buchstabe */
const ICON_CDN = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons";
const slug = s => String(s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function iconUrls(icon, l) {
  if (icon) return /^(https?:|\/|data:)/.test(icon) ? [icon] : [`${ICON_CDN}/svg/${slug(icon)}.svg`, `${ICON_CDN}/png/${slug(icon)}.png`];
  if (!l) return [];
  const names = [...new Set([slug(l.name), slug((l.domain || "").split(".")[0]), slug(l.targets?.[0]?.container?.name)].filter(Boolean))];
  return names.flatMap(n => [`${ICON_CDN}/svg/${n}.svg`]);
}
function iconHTML(l) {
  const urls = iconUrls(l.icon, l);
  return `<span class="ic" style="background:${color(l.domain || l.name)}">${esc((l.name[0] || "?").toUpperCase())}${urls.length
    ? `<img src="${esc(urls[0])}" data-alt="${esc(urls.slice(1).join("|"))}" alt="" loading="lazy" onload="this.parentNode.style.background='transparent'" onerror="iconFail(this)">` : ""}</span>`;
}
function iconFail(img) {
  const rest = img.dataset.alt ? img.dataset.alt.split("|") : [];
  if (rest.length) { img.dataset.alt = rest.slice(1).join("|"); img.src = rest[0]; } else img.remove();
}

function color(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 45%)`; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const multiPve = () => (D.sources?.proxmox || []).length > 1;
const kindLabel = g => (g.kind === "lxc" ? "LXC " : "VM ") + g.vmid;
const stateWord = { up: "online", warn: "teilweise erreichbar", down: "offline", unknown: "Status unbekannt" };
const COPY_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>`;

function targetText(l) {
  return (l.targets || []).map(t => {
    const p = [];
    if (t.guest) p.push(`${kindLabel(t.guest)} ${t.guest.name}`);
    if (t.container) p.push(`🐳 ${t.container.name}`);
    return p.join(" → ");
  }).filter(Boolean).join(" · ");
}
const everything = () => [...D.links, ...(D.services || [])];
const allItems = () => everything().filter(l => showHidden || !l.hidden);
const matches = (l, q) => !q || [l.name, l.domain, l.group, l.description, targetText(l), ...(l.addrs || [])]
  .join(" ").toLowerCase().includes(q);

function cardHTML(l, idx) {
  const tgt = targetText(l);
  const status = l.disabled
    ? `<span class="sw" title="In Zoraxy deaktiviert"></span>`
    : `<span class="dot ${l.state || ""}" title="${esc(stateWord[l.state || "unknown"])}"></span>`;
  const sub = l.unproxied ? (l.description || "kein Proxy") : (l.description || l.domain);
  return `
  <div class="card${l.disabled ? " off" : ""}${l.unproxied ? " unp" : ""}${l.hidden ? " hid" : ""}">
    <a class="main" href="${esc(l.url)}" target="_blank" rel="noopener">
      ${iconHTML(l)}
      <span class="tx">
        <div class="nm">${esc(l.name)}</div>
        <div class="dm">${esc(sub)}${l.disabled ? " · deaktiviert" : ""}${l.hidden ? " · ausgeblendet" : ""}</div>
        ${tgt ? `<div class="dm">${esc(tgt)}</div>` : ""}
      </span>
    </a>
    <span class="st">${status}</span>
    <button class="edit" data-edit="${esc(l.custom ? "c:" + l.id : "o:" + l.key)}" title="Bearbeiten">✎</button>
    ${(l.addrs || []).length ? `<div class="addrs">${l.addrs.map(a =>
      `<button class="cp" data-copy="${esc(a)}" title="In Zwischenablage kopieren"><span>${esc(a)}</span>${COPY_ICON}</button>`).join("")}</div>` : ""}
  </div>`;
}

function renderLinks(q) {
  const groups = {};
  for (const l of allItems().filter(l => matches(l, q))) (groups[l.group] ||= []).push(l);
  const order = Object.keys(groups).sort((a, b) =>
    (a === "Ohne Proxy") - (b === "Ohne Proxy") || a.localeCompare(b, "de"));
  const html = order.map(g => `
    <h2>${esc(g)}${g === "Ohne Proxy" ? ` <small>· läuft, aber keine Zoraxy-Route</small>` : ""}</h2>
    <div class="grid">${groups[g].map(cardHTML).join("")}</div>`).join("");
  return html || (allItems().length ? `<p class="empty">Keine Treffer.</p>` : "");
}

function renderAudit(q) {
  const rows = [];
  for (const l of D.links.filter(l => matches(l, q))) {
    for (const t of (l.targets?.length ? l.targets : [{ addr: "—" }])) {
      const st = l.disabled ? "off" : t.reachable === false ? "down" : t.reachable ? "up" : "unknown";
      const txt = l.disabled ? "deaktiviert" : t.reachable == null ? "–" : (t.reachable ? "erreichbar" : "nicht erreichbar");
      rows.push(`<tr>
        <td><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.domain)}</a>${l.custom ? ` <span class="tag">eigen</span>` : ""}</td>
        <td>${esc(t.addr)}<div class="sub">${t.ip ? esc(t.ip + ":" + t.port) : (t.container ? "Docker-Netzwerk" : t.host ? "DNS nicht auflösbar" : "")}</div></td>
        <td>${t.guest ? `<span class="tag">${esc(kindLabel(t.guest))}</span> ${esc(t.guest.name)}
              <div class="sub">${multiPve() ? esc(t.guest.cluster) + " / " : ""}${esc(t.guest.node)} · ${esc(t.guest.status)}</div>` : `<span class="sub">—</span>`}</td>
        <td>${t.container ? `🐳 ${esc(t.container.name)}<div class="sub">${esc(t.container.host)} · ${esc(t.container.status)}</div>`
              : `<span class="sub">—</span>`}</td>
        <td class="s-${st}">${txt}</td>
      </tr>`);
    }
  }
  const unmatched = D.links.filter(l => !l.matched && matches(l, q));
  const qf = x => !q || JSON.stringify(x).toLowerCase().includes(q);
  const freeGuests = D.guests.filter(g => !g.routed && qf(g));
  const freeConts = D.containers.filter(c => !c.routed && c.ports.length && qf(c));

  return `
    <h2>Routen → Ziel <small>(${rows.length})</small></h2>
    <div class="wrap"><table>
      <tr><th>Domain</th><th>Origin</th><th>Proxmox</th><th>Docker</th><th>Status</th></tr>
      ${rows.join("") || `<tr><td colspan="5" class="sub">Keine Routen.</td></tr>`}
    </table></div>

    <h2>Routen ohne bekanntes Ziel <small>(${unmatched.length})</small></h2>
    ${unmatched.length ? `<div class="wrap"><table>
      <tr><th>Domain</th><th>Origin</th></tr>
      ${unmatched.map(l => `<tr><td>${esc(l.domain)}</td><td>${esc(l.origins.map(o => o.addr).join(", "))}</td></tr>`).join("")}
    </table></div>` : `<p class="empty">Alle Routen sind einem Gast oder Container zugeordnet.</p>`}

    ${(D.sources.proxmox || []).length ? `
    <h2>Proxmox-Gäste ohne Route <small>(${freeGuests.length})</small></h2>
    ${freeGuests.length ? `<div class="wrap"><table>
      <tr><th>ID</th><th>Name</th><th>Cluster / Node</th><th>Status</th><th>IPs</th></tr>
      ${freeGuests.map(g => `<tr><td><span class="tag">${esc(kindLabel(g))}</span></td><td>${esc(g.name)}</td>
        <td>${multiPve() ? esc(g.cluster) + " / " : ""}${esc(g.node)}</td><td class="s-${g.status === "running" ? "up" : "unknown"}">${esc(g.status)}</td>
        <td>${esc(g.ips.join(", ") || "—")}</td></tr>`).join("")}
    </table></div>` : `<p class="empty">Keine.</p>`}` : ""}

    ${(D.sources.docker || []).length ? `
    <h2>Container mit offenen Ports ohne Route <small>(${freeConts.length})</small></h2>
    ${freeConts.length ? `<div class="wrap"><table>
      <tr><th>Host</th><th>Container</th><th>Image</th><th>Status</th><th>Ports</th></tr>
      ${freeConts.map(c => `<tr><td>${esc(c.host)}</td><td>${esc(c.name)}${c.compose ? `<div class="sub">${esc(c.compose)}</div>` : ""}</td>
        <td class="sub">${esc(c.image)}</td><td class="s-${c.state === "running" ? "up" : "down"}">${esc(c.status)}</td>
        <td>${esc(c.ports.join(", "))}</td></tr>`).join("")}
    </table></div>` : `<p class="empty">Keine.</p>`}` : ""}
  `;
}

const fmtB = b => b >= 1024 ** 4 ? (b / 1024 ** 4).toFixed(1) + " TB" : (b / 1024 ** 3).toFixed(b >= 100 * 1024 ** 3 ? 0 : 1) + " GB";
function bar(label, p, txt, limit) {
  const cls = limit && p >= limit ? "crit" : p >= (limit ? limit - 15 : 80) ? "warn" : "";
  return `<div class="bar"><div class="row"><span>${label}</span><span class="v">${txt}</span></div>
    <span class="tr"><span class="fl ${cls}" style="width:${Math.min(p, 100)}%"></span></span></div>`;
}
function renderStatus() {
  const el = $("#status");
  if (!S || (!S.nodes.length && !S.storages.length && !S.error)) { el.innerHTML = ""; return; }
  const t = S.thresholds || {};
  const clusters = [...new Set([...S.nodes, ...S.storages].map(x => x.cluster))];
  const nodeCard = n => `
    <div class="node">
      <div class="hd"><span class="dot ${n.status === "online" ? "up" : "down"}"></span>${esc(n.name)}
        <small>${n.status === "online" ? `${n.maxcpu} CPU · up ${Math.floor(n.uptime / 86400)} d` : esc(n.status)}</small></div>
      ${n.status === "online" ? `
      ${bar("CPU", n.cpu, `${n.cpu.toFixed(0)} %`, t.cpu)}
      ${bar("RAM", n.mem_pct, `${n.mem_pct.toFixed(0)} % <small>${fmtB(n.mem)} / ${fmtB(n.maxmem)}</small>`, t.ram)}
      ${bar("Disk", n.disk_pct, `${n.disk_pct.toFixed(0)} % <small>${fmtB(n.disk)} / ${fmtB(n.maxdisk)}</small>`, t.disk)}` : ""}
    </div>`;
  const storCard = s => `
    <div class="node">
      <div class="hd"><span class="dot ${s.status === "available" ? "up" : "down"}"></span>${esc(s.path || s.id)}
        <small>${esc(s.shared ? "shared" : s.node)}${s.path && s.id !== s.path ? " · " + esc(s.id) : ""}</small></div>
      ${bar("Belegt", s.pct, `${s.pct.toFixed(0)} % <small>${fmtB(s.disk)} / ${fmtB(s.maxdisk)}</small>`, t.disk)}
      <div class="bar"><div class="row"><span>Frei</span><span class="v">${fmtB(s.maxdisk - s.disk)}</span></div></div>
    </div>`;
  const err = S.error ? `<div class="wrn" style="grid-column:1/-1;color:var(--warn);font-size:13px">Proxmox: ${esc(S.error)}</div>` : "";
  if (clusters.length <= 1) {
    el.innerHTML = err + [...S.nodes.map(nodeCard), ...S.storages.map(storCard)].join("");
  } else {
    el.innerHTML = err + clusters.map(c => `<h2 style="grid-column:1/-1;margin:6px 0 0">Cluster ${esc(c)}</h2>` +
      [...S.nodes.filter(n => n.cluster === c).map(nodeCard), ...S.storages.filter(s => s.cluster === c).map(storCard)].join("")).join("");
  }
}
async function loadStatus() {
  try { S = await (await fetch("/api/status")).json(); renderStatus(); } catch {}
  $("#alerts-badge").textContent = S && S.active && S.active.length ? S.active.length : "";
}

function render() {
  const q = $("#search").value.trim().toLowerCase();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("#view").innerHTML = view === "audit" ? renderAudit(q) : renderLinks(q);
  const nh = everything().filter(l => l.hidden).length;
  $("#hid-wrap").hidden = !nh;
  $("#toggle-hidden").textContent = showHidden ? "Ausgeblendete verstecken" : `${nh} ausgeblendete anzeigen`;
}

function apply(d) {
  D = d;
  document.title = D.title;
  if (D.title !== "proxylink") $("#title").textContent = D.title;
  if (D.zoraxy_url) { $("#zoraxy").href = D.zoraxy_url; $("#zoraxy").hidden = false; }
  const m = [];
  if (D.error) m.push(`<div class="err">Zoraxy-Fehler: ${esc(D.error)}</div>`);
  (D.warnings || []).forEach(w => m.push(`<div class="wrn">${esc(w)}</div>`));
  if (!D.error && !D.links.length && !D.updated) m.push(`<div class="wrn">Noch keine Daten geladen…</div>`);
  $("#msg").innerHTML = m.join("");
  $("#upd").textContent = D.updated ? "Stand: " + new Date(D.updated * 1000).toLocaleTimeString("de-DE") : "";
  render();
}

async function load(path = "/api/links") {
  if (document.querySelector("dialog[open]")) return;  // gilt für beide Dialoge
  try { apply(await (await fetch(path)).json()); }
  catch (e) { $("#msg").innerHTML = `<div class="err">Backend nicht erreichbar.</div>`; }
}

/* Zwischenablage – navigator.clipboard gibt es nur über https/localhost, sonst Fallback */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); return ok;
}

/* Dialog für eigene Einträge */
const dlg = $("#dlg"), form = $("#form");
let mode = "custom";
function openDialog(entry, ovItem) {
  form.reset();
  mode = ovItem ? "override" : "custom";
  if (ovItem) entry = { key: ovItem.key, ...(ovItem.ov || {}) };
  for (const [k, v] of Object.entries(entry || {})) {
    const el = form.elements[k]; if (!el) continue;
    if (el.type === "checkbox") el.checked = !!v; else el.value = v ?? "";
  }
  document.querySelectorAll(".m-custom").forEach(e => e.hidden = mode !== "custom");
  document.querySelectorAll(".m-ov").forEach(e => e.hidden = mode !== "override");
  form.elements.name.required = form.elements.url.required = mode === "custom";
  form.elements.name.placeholder = ovItem ? ovItem.name : "";
  form.elements.url.placeholder = ovItem ? ovItem.url : "https://… oder 192.168.10.20:8080";
  form.elements.group.placeholder = ovItem ? ovItem.group : "Eigene";
  form.elements.description.placeholder = ovItem ? (ovItem.description || ovItem.domain) : "";
  previewIcon(ovItem);
  form.elements.token.value = ls.get("token") || "";
  $("#tok-wrap").hidden = !D.edit_protected;
  $("#del").hidden = !(mode === "custom" && entry);
  $("#ov-reset").hidden = !(mode === "override" && ovItem.ov && Object.keys(ovItem.ov).length);
  $("#dlg-title").textContent = ovItem ? `${ovItem.name} anpassen` : entry ? "Eintrag bearbeiten" : "Eigener Eintrag";
  $("#dlg-err").textContent = "";
  $("#groups").innerHTML = [...new Set(allItems().map(l => l.group))].map(g => `<option value="${esc(g)}">`).join("");
  dlg.showModal();
  form.elements.name.focus();
}
async function send(method, path, body) {
  const tok = form.elements.token.value;
  if (tok) ls.set("token", tok);
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Edit-Token": tok },
                                body: body && JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
form.addEventListener("submit", async e => {
  const action = e.submitter?.value;
  if (action === "cancel") return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  delete data.token;
  try {
    if (mode === "override") {
      if (action === "reset") { apply(await send("POST", "/api/override", { key: data.key })); dlg.close(); return; }
      data.hide = form.elements.hide.checked;
      delete data.id; delete data.origin;
      apply(await send("POST", "/api/override", data));
    } else if (action === "delete") {
      if (!confirm(`„${data.name}“ löschen?`)) return;
      apply(await send("DELETE", "/api/custom/" + data.id));
    } else {
      if (!data.id) delete data.id;
      delete data.key; delete data.hide;
      apply(await send("POST", "/api/custom", data));
    }
    dlg.close();
  } catch (err) { $("#dlg-err").textContent = err.message; }
});

/* Alarm-Einstellungen */
const adlg = $("#adlg"), aform = $("#aform");
const ALERT_LABEL = { cpu: "CPU", ram: "RAM", disk: "Disk", down: "offline" };
const alertText = k => k.startsWith("storage:") ? `Speicher ${k.slice(8)}` : `${k.split(":")[0]} ${ALERT_LABEL[k.split(":")[1]] || k}`;
async function openAlerts() {
  $("#a-err").textContent = ""; $("#a-ok").textContent = "";
  let st;
  try { st = await (await fetch("/api/settings")).json(); } catch { return; }
  aform.reset();
  for (const [k, v] of Object.entries(st)) {
    const el = aform.elements[k]; if (!el) continue;
    if (el.type === "checkbox") el.checked = !!v; else if (k !== "telegram_token") el.value = v;
  }
  $("#tok-hint").textContent = st.token_set ? `Token gespeichert (${st.token_hint || "••••"}). Leer lassen = behalten, „-“ = löschen.` : "Noch kein Token gespeichert.";
  aform.elements.token.value = ls.get("token") || "";
  $("#atok-wrap").hidden = !D.edit_protected;
  const act = (S && S.active) || [];
  $("#a-active").innerHTML = act.length ? `<div class="active-alerts">Aktiv: ${act.map(alertText).map(esc).join(", ")}</div>` : "";
  adlg.showModal();
}
aform.addEventListener("submit", async e => {
  const action = e.submitter?.value;
  if (action === "cancel") return;
  e.preventDefault();
  $("#a-err").textContent = ""; $("#a-ok").textContent = "";
  const f = aform.elements;
  const data = { telegram_enabled: f.telegram_enabled.checked, node_down: f.node_down.checked,
                 telegram_token: f.telegram_token.value, telegram_chat_id: f.telegram_chat_id.value };
  for (const k of ["cpu", "ram", "disk", "minutes", "hysteresis", "repeat"]) data[k] = f[k].value;
  const tok = f.token.value; if (tok) ls.set("token", tok);
  const post = (p, b) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json", "X-Edit-Token": tok }, body: JSON.stringify(b) });
  try {
    let r = await post("/api/settings", data), d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    f.telegram_token.value = "";
    $("#tok-hint").textContent = d.token_set ? `Token gespeichert (${d.token_hint || "••••"}). Leer lassen = behalten, „-“ = löschen.` : "Noch kein Token gespeichert.";
    if (action === "test") {
      r = await post("/api/telegram-test", {}); d = await r.json();
      if (!r.ok) throw new Error("Telegram: " + (d.error || r.statusText));
      $("#a-ok").textContent = "Gespeichert, Testnachricht verschickt ✓";
    } else {
      $("#a-ok").textContent = "Gespeichert ✓";
    }
    loadStatus();
  } catch (err) { $("#a-err").textContent = err.message; }
});
$("#alerts-btn").onclick = openAlerts;

/* Events */
$("#view").addEventListener("click", async e => {
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const ok = await copyText(cp.dataset.copy);
    cp.classList.add("ok"); cp.querySelector("span").textContent = ok ? "kopiert ✓" : "nicht möglich";
    setTimeout(() => { cp.classList.remove("ok"); cp.querySelector("span").textContent = cp.dataset.copy; }, 1200);
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) {
    const [t, k] = [ed.dataset.edit.slice(0, 1), ed.dataset.edit.slice(2)];
    if (t === "c") openDialog(D.links.find(l => l.id === k)?.raw);
    else openDialog(null, everything().find(l => l.key === k));
  }
});
$("#add").onclick = () => openDialog(null);
function previewIcon(item) {
  const urls = iconUrls(form.elements.icon.value.trim(), item || { name: form.elements.name.value });
  const img = $("#ic-prev");
  img.dataset.alt = urls.slice(1).join("|");
  img.onerror = () => iconFail2(img);
  if (urls[0]) { img.style.visibility = "visible"; img.src = urls[0]; } else img.style.visibility = "hidden";
}
function iconFail2(img) {
  const rest = img.dataset.alt ? img.dataset.alt.split("|") : [];
  if (rest.length) { img.dataset.alt = rest.slice(1).join("|"); img.src = rest[0]; } else img.style.visibility = "hidden";
}
let prevT;
form.elements.icon.addEventListener("input", () => { clearTimeout(prevT); prevT = setTimeout(() => previewIcon(), 300); });
$("#toggle-hidden").onclick = () => { showHidden = !showHidden; render(); };
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.v; ls.set("view", view); render(); });
$("#search").addEventListener("input", render);
$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter") { const a = document.querySelector("a.main"); if (a) window.open(a.href, "_blank"); }
  if (e.key === "Escape") { e.target.value = ""; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !dlg.open && !adlg.open && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#search").focus(); }
});
$("#reload").onclick = () => load("/api/refresh");

const tick = () => $("#clock").textContent = new Date().toLocaleString("de-DE", { weekday: "long", day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" });
tick(); setInterval(tick, 10000);
load(); setInterval(load, 30000);
loadStatus(); setInterval(loadStatus, 15000);
</script>
