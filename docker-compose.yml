services:
  proxylink:
    build: .
    container_name: proxylink
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./config:/config:ro
      # Alle Einstellungen (Anordnung, Anpassungen, eigene Einträge, Alarme) liegen hier auf dem Host.
      # Der Container setzt die Rechte beim Start selbst – einfach den Ordner sichern.
      - ./data:/data
      # Lokaler Docker-Host (nur lesend). Für Docker auf anderen Hosts siehe README.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional, falls /mnt/share kein Proxmox-Storage ist (dann LOCAL_DISKS=share=/mnt/share):
      # - /mnt/share:/mnt/share:ro
