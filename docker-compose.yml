services:
  proxylink:
    build: .
    container_name: proxylink
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./config:/config:ro
      # Lokaler Docker-Host (nur lesend). Für Docker auf anderen Hosts siehe README.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Container braucht Lesezugriff auf den Socket (GID der docker-Gruppe auf dem Host):
    group_add:
      - "${DOCKER_GID:-999}"
